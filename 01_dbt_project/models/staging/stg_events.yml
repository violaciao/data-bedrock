version: 2

models:
  - name: stg_events
    description: >
      Cleaned event stream. One row per event. Only light cleaning applied —
      no deduplication or parsing of the properties JSON.

    columns:
      - name: event_id
        description: Unique event identifier.
        tests:
          - not_null
          - unique

      - name: user_id
        description: FK to stg_users.user_id.
        tests:
          - not_null

      - name: event_type
        description: Lower-cased event name (e.g. "page_view", "signup").
        tests:
          - not_null

      - name: occurred_at
        description: UTC timestamp of the event.
        tests:
          - not_null

      - name: properties
        description: Raw JSON string of event properties. May be "{}".
